name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Test
        run: go test ./...
      - name: Build
        run: GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o drobo-linux-amd64 ./cmd/drobo
      - name: Checksum
        run: sha256sum drobo-linux-amd64 > drobo-linux-amd64.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--title "droboctl $GITHUB_REF_NAME" --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" drobo-linux-amd64 drobo-linux-amd64.sha256 "${args[@]}"

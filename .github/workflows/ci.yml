name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - run: go test ./...
      - run: go vet ./...
      - run: GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o drobo-linux-amd64 ./cmd/drobo
      - run: sha256sum drobo-linux-amd64 > drobo-linux-amd64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: drobo-linux-amd64
          path: |
            drobo-linux-amd64
            drobo-linux-amd64.sha256

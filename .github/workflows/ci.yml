name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o drobo ./cmd/drobo
      - uses: actions/upload-artifact@v4
        with:
          name: drobo-linux-amd64
          path: drobo
